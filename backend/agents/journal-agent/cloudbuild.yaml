steps:
  # Install dependencies
  - name: 'gcr.io/cloud-builders/npm'
    args: ['install']

  # Run test suite
  - name: 'gcr.io/cloud-builders/npm'
    args: ['test']

  # Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build',
      '-t',
      'asia-south1-docker.pkg.dev/$PROJECT_ID/journal-agent-repo/journal-agent:latest',
      '.'
    ]

images:
  - 'asia-south1-docker.pkg.dev/$PROJECT_ID/journal-agent-repo/journal-agent:latest'
